<!DOCTYPE html>
<html>
<head>
    <title>ExploreIt - Directions</title>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        header { background-color: #333; color: white; padding: 20px; text-align: center; margin-bottom: 20px; }
        .map-container { background: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #map { height: 400px; margin-top: 15px; border-radius: 5px; }
        #inputs { margin-bottom: 15px; }
        .input-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #4CAF50; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 4px; }
        button:hover { background: #45a049; }
        .buttons { display: flex; gap: 10px; margin-top: 10px; }
        .back-link { display: inline-block; margin-top: 20px; color: #333; text-decoration: none; }
        #instructions { margin-top: 15px; padding: 10px; background: #f5f5f5; border-radius: 5px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
<header>
    <div class="container">
        <h1>ExploreIt</h1>
    </div>
</header>

<div class="container">
    <div class="map-container">
        <h2>Directions to Event</h2>
        <div id="event-info"></div>

        <div id="inputs">
            <div class="input-group">
                <label for="start">Your Location:</label>
                <input id="start" type="text" placeholder="Enter your starting location">
            </div>
            <div class="buttons">
                <button id="use-location">Use My Current Location</button>
                <button id="get-directions">Get Directions</button>
            </div>
        </div>

        <div id="map"></div>
        <div id="instructions"></div>
    </div>

    <a href="/" class="back-link"><-- Back to Events</a>
</div>

<script src='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.1.1/mapbox-gl-directions.js"></script>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.1.1/mapbox-gl-directions.css" type="text/css">

<script>
    // taking event ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('eventId');
    let eventCoordinates = null;
    let map = null;
    let directions = null;

    // Mapbox access token
    mapboxgl.accessToken = 'pk.eyJ1IjoiY2hyaXN0aW5hMTAwNiIsImEiOiJjbThhbHJ5NXowZmY0MmxyMGZnNGRhYWxzIn0.2fRuBt3LhuR72zTsDxfduw';

    // Load event details when page loads
    document.addEventListener('DOMContentLoaded', function() {
        if (!eventId) {
            window.location.href = '/';
            return;
        }

        loadEventDetails(eventId);
        initializeMap();

    document.getElementById('get-directions').addEventListener('click', getDirections);
     document.getElementById('use-location').addEventListener('click', useCurrentLocation);
    });

    function initializeMap() {
        map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v12',
            center: [-0.1278, 51.5074], // Default: London
            zoom: 12
        });

        // Add directions control
        directions = new MapboxDirections({
            accessToken: mapboxgl.accessToken,
            unit: 'metric',
            profile: 'mapbox/driving',
            alternatives: false,
            geometries: 'geojson',
            controls: { instructions: false },
            flyTo: false
        });

        map.addControl(directions, 'top-left');
    }

    // Load event details
    function loadEventDetails(eventId) {
        fetch(`/api/events/${eventId}`)
            .then(response => response.json())
            .then(event => {
                // Display event info
                document.getElementById('event-info').innerHTML = `
                    <h3>${event.title}</h3>
                    <p><strong>Venue:</strong> ${event.venue}</p>
                    <p><strong>Address:</strong> ${event.address}, ${event.city}</p>
                `;

                // Set destination in directions control
                const destination = `${event.venue}, ${event.address}, ${event.city}`;
                directions.setDestination(destination);
            })
            .catch(error => {
                console.error('Error loading event:', error);
            });
    }

    // Get directions from entered address
    function getDirections() {
        const startAddress = document.getElementById('start').value;
        if (startAddress) {
            directions.setOrigin(startAddress);
        } else {
            alert('Please enter your starting location');
        }
    }

    // User's current location
    function useCurrentLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                position => {
                    const coords = [position.coords.longitude, position.coords.latitude];
                    directions.setOrigin(coords);
                },
                error => {
                    alert('Error getting your location: ' + error.message);
                }
            );
        } else {
            alert('Geolocation is not supported by your browser');
        }
    }
</script>
</body>
</html>
