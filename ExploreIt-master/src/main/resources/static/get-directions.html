<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExploreIt - Get Directions</title>
  <link href='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css' rel='stylesheet' />
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f4f4f4;
    }
    .container {
        max-width: 1200px;
        margin: 0 auto;
    }
    header {
        background-color: #333;
        color: white;
        padding: 40px 20px;
        text-align: center;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }
    .directions-box {
        background-color: white;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        padding: 20px;
        margin-bottom: 20px;
    }
    #map {
        width: 100%;
        height: 400px;
        border-radius: 5px;
        margin-bottom: 20px;
    }
    input {
        width: 100%;
        padding: 8px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
    }

 button {
        background-color: #4CAF50;
        color: white;
        border: none;
        padding: 8px;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.3s;
    }
button:hover {
background-color: #45a049;
    }
.button-group {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }
    #instructions {
        padding: 15px;
        background-color: #f9f9f9;
        border-radius: 5px;
        max-height: 200px;
        overflow-y: auto;
    }
    .back-link {
        display: inline-block;
        margin-top: 15px;
        color: #333;
        text-decoration: none;
    }
    #event-info {
        margin-bottom: 20px;
    }
  </style>
</head>
<body>
<header>
  <div class="container">
    <h1>ExploreIt</h1>
    <p class="tagline">Find your next adventure</p>
  </div>
</header>

<div class="container">
  <div class="directions-box">
    <h2>Get Directions</h2>

    <div id="event-info">
      <p>Loading event details...</p>
    </div>

    <div>
      <label for="start">Your Starting Location:</label>
      <input type="text" id="start" placeholder="Enter your location">
    </div>

    <div class="input-group">
      <label for="profile">Transportation Mode:</label>
      <select id="profile">
        <option value="driving">Driving</option>
        <option value="walking">Walking</option>
        <option value="cycling">Cycling</option>
      </select>
    </div>

    <div class="button-group">
      <button onclick="useMyLocation()">Use My Location</button>
      <button onclick="getDirections()">Get Directions</button>
    </div>

    <div id="map"></div>

    <div id="instructions">
      <p>Enter your location and click "Get Directions" to see the route.</p>
    </div>
  </div>

  <a href="/" class="back-link"><-- Back to Events</a>
</div>

<script src='https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js'></script>
<script>
  const mapboxToken = 'pk.eyJ1IjoiY2hyaXN0aW5hMTAwNiIsImEiOiJjbThhbHJ5NXowZmY0MmxyMGZnNGRhYWxzIn0.2fRuBt3LhuR72zTsDxfduw';
  let map;
  let eventData;
  let destination;

// Get event ID
  const urlParams = new URLSearchParams(window.location.search);
  const eventId = urlParams.get('eventId');

document.addEventListener('DOMContentLoaded', function() {
// Redirect to home if no event ID
      if (!eventId) {
          window.location.href = '/';
          return;
      }


//map

  mapboxgl.accessToken = mapboxToken;
   map = new mapboxgl.Map({
   container: 'map',
    style: 'mapbox://styles/mapbox/streets-v12',
    center: [-0.1278, 51.5074], // Default: London
    zoom: 12
    });

       loadEventDetails();

      useMyLocation();
  });


//event detials
  function loadEventDetails() {
      fetch(`/api/events/${eventId}`)
          .then(response => response.json())
          .then(event => {
              eventData = event;

              const eventInfoHTML = `
                  <h3>${event.title}</h3>
                  <p><strong>Venue:</strong> ${event.venue}</p>
                  <p><strong>Address:</strong> ${event.address}, ${event.city}</p>
              `;
              document.getElementById('event-info').innerHTML = eventInfoHTML;


              destination = `${event.venue}, ${event.address}, ${event.city}`;// destination string
showDestinationOnMap(destination);
          })
          .catch(error => {
              console.error('Error loading event:', error);
              document.getElementById('event-info').innerHTML =
                  '<p>Error loading event details. Please try again later.</p>';
          });
  }




function showDestinationOnMap(address) {
      // Geocodeing
      fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(address)}.json?access_token=${mapboxToken}`)
          .then(response => response.json())
          .then(data => {
           if (data.features && data.features.length > 0) {
           const coords = data.features[0].geometry.coordinates;

           map.setCenter(coords);

           new mapboxgl.Marker({ color: '#4CAF50' })// Adding marker
                      .setLngLat(coords)
                      .setPopup(new mapboxgl.Popup().setHTML(`
                          <h3>${eventData.title}</h3>
                          <p>${eventData.venue}</p>
                      `))
                      .addTo(map);
              }
          })
          .catch(error => {
              console.error('Error geocoding destination:', error);
          });
  }




// using user's current location
 function useMyLocation() {
 if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    position => {
   const lat = position.coords.latitude;
   const lng = position.coords.longitude;


     fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${lng},${lat}.json?access_token=${mapboxToken}`)
            .then(response => response.json())
            .then(data => {
             if (data.features && data.features.length > 0) {
             document.getElementById('start').value = data.features[0].place_name;
             } else {
             document.getElementById('start').value = `${lat}, ${lng}`;
            }


             getDirections();
                      })
                      .catch(error => {
                          console.error('Error reverse geocoding:', error);
                          document.getElementById('start').value = `${lat}, ${lng}`;
                      });
              },
              error => {
                  console.error('Error getting location:', error);
                  alert('Could not get your location. Please enter it manually.');
              }
          );
      } else {
          alert('Geolocation is not supported by your browser');
      }
  }




function getDirections() {
    const startAddress = document.getElementById('start').value;
    const profile = document.getElementById('profile').value;

    if (!startAddress) {
        alert('Please enter your starting location');
        return;
    }

    if (!destination) {
        alert('Destination not loaded yet. Please try again in a moment.');
        return;
    }




// geocode starting location
    fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(startAddress)}.json?access_token=${mapboxToken}`)
        .then(response => response.json())
        .then(startData => {
            if (!startData.features || startData.features.length === 0) {
                throw new Error('Could not find starting location');
            }

     const startCoords = startData.features[0].geometry.coordinates;
     const startPlaceName = startData.features[0].place_name;

     console.log("Start location found:", startPlaceName);
     console.log("Start coordinates:", startCoords);

 // start marker
    new mapboxgl.Marker({ color: '#3887be' })
    .setLngLat(startCoords)
    .setPopup(new mapboxgl.Popup().setHTML(`<p>Starting point: ${startPlaceName}</p>`))
    .addTo(map);




  return fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(destination)}.json?access_token=${mapboxToken}`)
                .then(response => response.json())
                .then(destData => {
                    if (!destData.features || destData.features.length === 0) {
                        throw new Error('Could not find destination');
                    }

                    const destCoords = destData.features[0].geometry.coordinates;
                    const destPlaceName = destData.features[0].place_name;
                    console.log("Destination found:", destPlaceName);
                    console.log("Destination coordinates:", destCoords);

                    // getting directions
<!--const directionsUrl = `https://api.mapbox.com/directions/v5/mapbox/driving/${startCoords[0]},${startCoords[1]};${destCoords[0]},${destCoords[1]}?steps=true&geometries=geojson&access_token=${mapboxToken}`;-->
  const directionsUrl = `https://api.mapbox.com/directions/v5/mapbox/${profile}/${startCoords[0]},${startCoords[1]};${destCoords[0]},${destCoords[1]}?steps=true&geometries=geojson&access_token=${mapboxToken}`;

                    return fetch(directionsUrl);
                });
        })
        .then(response => response.json())
        .then(data => {
            if (!data.routes || data.routes.length === 0) {
                throw new Error('No route found between these locations');
            }


            displayRoute(data);
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('instructions').innerHTML = `
                <p>Error: ${error.message}</p>
                <p>Try entering a more specific address, postal code, or place name.</p>
                <p>Examples: "BA4 4BY", "Somerset, UK", "10 Downing Street, London"</p>
            `;
        });
}

  function displayRoute(data) {
    // Remove any existing route
    if (map.getSource('route')) {
        map.removeLayer('route');
        map.removeSource('route');
    }

    const route = data.routes[0];
    const profile = document.getElementById('profile').value;

// color based on profile
    let routeColor;
    switch (profile) {
        case 'walking':
            routeColor = '#3bb2d0'; // Blue
            break;
        case 'cycling':
            routeColor = '#8a3ffc'; // Purple
            break;
        default: // driving
            routeColor = '#3887be'; // Default blue
    }

// Add the route to the map
 map.addSource('route', {
  type: 'geojson',
  data: {
     type: 'Feature',
      properties: {},
      geometry: route.geometry
        }
    });

    map.addLayer({
        id: 'route',
        type: 'line',
        source: 'route',
        layout: {
            'line-join': 'round',
            'line-cap': 'round'
        },
        paint: {
            'line-color': routeColor,
            'line-width': 5,
            'line-opacity': 0.75
        }
    });





const bounds = new mapboxgl.LngLatBounds();
 route.geometry.coordinates.forEach(coord => bounds.extend(coord));
 map.fitBounds(bounds, { padding: 50 });

 let transportMode = profile.charAt(0).toUpperCase() + profile.slice(1);

 const distance = (route.distance / 1000).toFixed(1);
  const duration = Math.round(route.duration / 60);

    let directionsHTML = `
        <h3>${transportMode} Directions</h3>
        <p><strong>Distance:</strong> ${distance} km</p>
        <p><strong>Duration:</strong> ${duration} minutes</p>
        <ol>
    `;

    route.legs[0].steps.forEach(step => {
        directionsHTML += `<li>${step.maneuver.instruction}</li>`;
    });

    directionsHTML += '</ol>';

    document.getElementById('instructions').innerHTML = directionsHTML;
}
</script>
</body>
</html>
