<!DOCTYPE html>
<html>
<head>
    <title>ExploreIt - Add New Event</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        h1, h2 {
            margin: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #333;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .success-message {
            background-color: #dff0d8;
            color: #3c763d;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
<header>
    <div>
        <h1>ExploreIt</h1>
    </div>
</header>

<div class="container">
    <h2>Add New Event</h2>

    <form id="addEventForm">
        <div class="form-group">
            <label for="title">Event Title</label>
            <input type="text" id="title" required>
        </div>

        <div class="form-group">
            <label for="type">Event Type</label>
            <select id="type" required>
                <option value="">Select Type</option>
                <option value="concert">Concert</option>
                <option value="conference">Conference</option>
                <option value="comedy">Comedy</option>
                <option value="festival">Festival</option>
                <option value="sport">Sport</option>
                <option value="theater">Theater</option>
                <option value="tech">Tech</option>
                <option value="exhibition">Exhibition</option>
            </select>
        </div>

        <div class="form-group">
            <label for="date">Event Date</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label for="venue">Venue Name</label>
            <input type="text" id="venue" required>
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" required>
        </div>

        <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" required>
        </div>

        <div class="form-group">
            <label for="availableTickets">Available Tickets</label>
            <input type="number" id="availableTickets" min="1" required>
        </div>

        <div class="form-group">
            <label for="ticketPrice">Ticket Price (£)</label>
            <input type="number" id="ticketPrice" min="0" step="0.01" required>
        </div>

        <div class="form-group">
            <label for="imageUrl">Event Image URL</label>
            <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">
            <small>Provide a URL to an image for this event</small>
        </div>

        <button type="submit">Add Event</button>
    </form>

    <div id="successMessage" class="success-message">
        <h3>Event Added Successfully!</h3>
        <p>Your new event has been added to the system.</p>
    </div>

    <a href="/" class="back-link"><-- Back to Events</a>
</div>

<script>
    document.getElementById('addEventForm').addEventListener('submit', function(e) {
    e.preventDefault();

 const newEvent = {
    title: document.getElementById('title').value.trim(),
    type: document.getElementById('type').value,
    date: document.getElementById('date').value,
    venue: document.getElementById('venue').value.trim(),
    address: document.getElementById('address').value.trim(),
    city: document.getElementById('city').value.trim(),
    availableTickets: parseInt(document.getElementById('availableTickets').value),
    ticketPrice: parseFloat(document.getElementById('ticketPrice').value),
    imageUrl: document.getElementById('imageUrl').value.trim() || "https://via.placeholder.com/300x150?text=Event"
};


    fetch('/api/events', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(newEvent)
})
.then(response => {
    if (!response.ok) {
        throw new Error('Server returned: ' + response.status);
    }
    return response.json();
})
.then(event => {
    // Show success message and reset form
    document.getElementById('addEventForm').reset();
    document.getElementById('successMessage').style.display = 'block';
})
.catch(error => {
    console.error('Error:', error);
    alert('Failed to add event: ' + error.message);
})
.finally(() => {
    submitBtn.textContent = originalText;
    submitBtn.disabled = false;
});
</script>
</body>
</html>
